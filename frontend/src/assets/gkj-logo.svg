<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gkjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a254a" />
      <stop offset="50%" stop-color="#123b70" />
      <stop offset="100%" stop-color="#071a35" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="gkjGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#123b70" stop-opacity="0" />
    </radialGradient>

    <!-- Text Paths -->
    <path id="arcTop" d="M 26,100 A 74,74 0 0,1 174,100" />
    <path id="arcBottom" d="M 174,104 A 74,74 0 0,1 26,104" />
  </defs>

  <!-- Outer Shadow & Base Ring -->
  <circle cx="100" cy="100" r="98" fill="url(#gkjGold)" />
  <circle cx="100" cy="100" r="95" fill="#081d3a" />
  <circle cx="100" cy="100" r="92" fill="url(#gkjBg)" />
  <circle cx="100" cy="100" r="62" fill="none" stroke="url(#gkjGold)" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6" />

  <!-- Circular Text -->
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="2.5">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">
      GKJ KOTAGEDE
    </textPath>
  </text>

  <text font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#fde047" letter-spacing="2">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">
      GEREJA KRISTEN JAWA
    </textPath>
  </text>

  <!-- Side Stars -->
  <polygon points="20,100 23,96 26,100 21,97 25,97" fill="#fde047" />
  <polygon points="174,100 177,96 180,100 175,97 179,97" fill="#fde047" />

  <!-- Center Circle / Sanctuary -->
  <circle cx="100" cy="100" r="58" fill="#0a254a" stroke="url(#gkjGold)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="56" fill="url(#sunGlow)" />

  <!-- Sun Rays behind cross -->
  <g stroke="#fef08a" stroke-width="1" opacity="0.4" stroke-linecap="round">
    <line x1="100" y1="52" x2="100" y2="46" />
    <line x1="120" y1="58" x2="124" y2="53" />
    <line x1="134" y1="74" x2="140" y2="70" />
    <line x1="80" y1="58" x2="76" y2="53" />
    <line x1="66" y1="74" x2="60" y2="70" />
  </g>

  <!-- Javanese Gunungan Silhouette Motif -->
  <path d="M 68,142 C 68,124 82,106 100,74 C 118,106 132,124 132,142 C 122,140 114,144 100,138 C 86,144 78,140 68,142 Z"
        fill="none" stroke="url(#gkjGold)" stroke-width="2" opacity="0.85" />
  <path d="M 76,141 C 76,128 86,115 100,90 C 114,115 124,128 124,141"
        fill="none" stroke="url(#gkjGold)" stroke-width="1.2" opacity="0.6" />

  <!-- Christian Cross in Center -->
  <rect x="94" y="55" width="12" height="74" rx="2" fill="#b45309" />
  <rect x="76" y="73" width="48" height="12" rx="2" fill="#b45309" />
  <rect x="95" y="54" width="10" height="73" rx="2" fill="url(#crossGrad)" />
  <rect x="77" y="72" width="46" height="10" rx="2" fill="url(#crossGrad)" />
  <line x1="100" y1="56" x2="100" y2="125" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="79" y1="77" x2="121" y2="77" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Holy Spirit Dove (Merpati) -->
  <g transform="translate(102, 60) scale(0.68)">
    <path d="M 18,22 C 24,10 38,4 52,2 C 44,14 36,22 28,26 C 36,24 46,24 54,28 C 42,34 32,36 24,35"
          fill="#ffffff" />
    <path d="M 8,28 C 14,24 22,23 28,26 C 26,34 18,40 10,44 C 6,42 4,36 6,32 C 4,30 2,29 0,29 C 4,27 6,27 8,28 Z"
          fill="#ffffff" />
    <circle cx="5" cy="30" r="1.2" fill="#0f2e5a" />
    <path d="M 12,42 C 16,50 18,60 16,72 C 14,64 12,56 8,48"
          fill="url(#gkjGold)" opacity="0.8" />
  </g>
</svg>
